<rect x="325" y="15" width="310" height="65" rx="9" fill="#f2f3f5" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="35.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Validated defining matrices</text>
<text x="480.0" y="59.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">and the gluing construction</text>
<rect x="15" y="130" width="280" height="70" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="155.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Minimum norm of L56</text>
<text x="155.0" y="177.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">is 6: rigorous enumeration</text>
<rect x="340" y="130" width="280" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Even unimodularity</text>
<text x="480.0" y="177.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">of the constructed lattice</text>
<rect x="665" y="130" width="280" height="70" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="805.0" y="153.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Isometries commuting</text>
<text x="805.0" y="177.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">with the gluing map</text>
<rect x="15" y="260" width="280" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="155.0" y="283.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Theta series gives</text>
<text x="155.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">the two shell sizes</text>
<rect x="340" y="260" width="280" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="283.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Midpoint lemma</text>
<text x="480.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">and certificate criteria</text>
<rect x="665" y="260" width="280" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="805.0" y="283.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Only four possible</text>
<text x="805.0" y="307.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">types of short vectors</text>
<rect x="15" y="405" width="280" height="75" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="155.0" y="430.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Complete norm-6 orbits</text>
<text x="155.0" y="454.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">with equivariance</text>
<rect x="340" y="405" width="280" height="75" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="430.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Complete norm-8 orbits</text>
<text x="480.0" y="454.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">with equivariance</text>
<rect x="15" y="580" width="280" height="85" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="155.0" y="610.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Odd-class lower bounds</text>
<text x="155.0" y="634.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">checked certificates</text>
<rect x="340" y="580" width="280" height="85" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="610.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Even-class lower bounds</text>
<text x="480.0" y="634.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">checked certificates</text>
<rect x="665" y="580" width="280" height="85" rx="9" fill="#e6f0fa" stroke="#7890a2" stroke-width="1.3"/>
<text x="805.0" y="610.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Even-class lower bounds</text>
<text x="805.0" y="634.5" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">canonical-form test</text>
<rect x="505" y="720" width="280" height="58" rx="9" fill="#fff1ce" stroke="#7890a2" stroke-width="1.3"/>
<text x="645.0" y="737.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Either even-class</text>
<text x="645.0" y="761.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">method suffices</text>
<rect x="325" y="865" width="310" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="888.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">No nonzero vector</text>
<text x="480.0" y="912.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">of norm below 10</text>
<rect x="665" y="865" width="280" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="805.0" y="888.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">The extremal bound</text>
<text x="805.0" y="912.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">in dimension 112</text>
<rect x="325" y="1005" width="310" height="70" rx="9" fill="#e7f2e9" stroke="#7890a2" stroke-width="1.3"/>
<text x="480.0" y="1028.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">Minimum is 10:</text>
<text x="480.0" y="1052.0" text-anchor="middle" dominant-baseline="central" font-family="DejaVu Sans, sans-serif" font-size="18">the lattice is extremal</text>
<text x="480" y="1115" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16">Blue: finite checks. Green: mathematical deductions. Dashed arrows: alternatives.</text>
