name: checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-inputs:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: V0, basic facts about the input data (about 20 s)
        run: python3 code/verify/v0_inputs.py
      - name: Genus certificates (numpy only)
        run: python3 -I code/supplementary/genus/genus.py check

  docker-verify:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the light image (Dockerfile)
        run: docker build -t l112 .
      - name: V0 inside the image (about 20 s)
        run: docker run --rm l112

  paper-consistency:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -I paper/tools/check-paper.py

  typst-build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: 0.14.2
      - run: sudo apt-get install -y fonts-ipaexfont fonts-dejavu
      - name: Compile the four documents (PDFs go to build/; the committed PDFs are not touched)
        run: |
          mkdir -p build
          for f in paper.en paper.ja supplement.en supplement.ja; do
            typst compile --root . "paper/$f.typ" "build/$f.pdf" 2> "build/$f.log" || { cat "build/$f.log"; exit 1; }
            cat "build/$f.log"
          done
          if grep -l "unknown font family" build/*.log; then
            echo "::error::a font is missing"; exit 1
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: pdfs
          path: build/*.pdf

  # release-pdfs: delete this job (and the `tags` trigger above) to stop attaching PDFs to releases.
  release-pdfs:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: typst-community/setup-typst@v5.3.0
        with:
          typst-version: 0.14.2
      - run: sudo apt-get install -y fonts-ipaexfont fonts-dejavu
      - name: Compile the four documents
        run: |
          mkdir -p build
          for f in paper.en paper.ja supplement.en supplement.ja; do
            typst compile --root . "paper/$f.typ" "build/$f.pdf" 2> "build/$f.log" || { cat "build/$f.log"; exit 1; }
            cat "build/$f.log"
          done
          if grep -l "unknown font family" build/*.log; then
            echo "::error::a font is missing"; exit 1
          fi
      - name: Attach the PDFs to the release of this tag (created if absent; notes untouched)
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: build/*.pdf
